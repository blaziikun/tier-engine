# .github/workflows/ci.yml
# ─────────────────────────────────────────────────────────────────────────────
#  Every push and pull request: secret scan over the whole history, identity guard,
#  audit, lint, types, dead code, unit tests, and the browser tests on the example
#  page (example/, with the accessibility checks). Nothing is deployed from here:
#  the apps run their browser tests against a tagged version of this engine and
#  deploy themselves (docs/hosting.md {1}). Needs the
#  repository secret PRIVATE_WORDS.
#
#  Third-party actions are pinned to exact commits, so a moved tag can't change
#  what runs here. Versions are in the comments; Dependabot keeps them current.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
    push:
        branches: [main]
    pull_request:

# read-only by default; nothing here writes to the repository
permissions:
    contents: read

# a newer push to a pull request cancels the older run; on main every run finishes
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Gitleaks over every commit on every branch and tag, on every run. (The Gitleaks action only scans the
    # commits a push adds, and downloads its binary unchecked, so it's built here from source instead.)
    secrets:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # the whole history, every branch and tag
                  persist-credentials: false
            # The runner's own Go builds an exact release. Go checks the source against sum.golang.org's public,
            # append-only log (and fetches a newer Go the same way if Gitleaks needs one), so a release changed
            # after the fact can't run here. To update: docs/security.md {6}.
            - name: Install Gitleaks
              run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
            - name: Gitleaks over every commit
              run: |
                  "$(go env GOPATH)/bin/gitleaks" git --log-opts=--all --redact --verbose --no-banner .

    # Nothing public may contain one of my private words (scripts/identity-guard.ts, docs/security.md {8}). The only step that
    # sees PRIVATE_WORDS is the guard itself. Pull requests from forks never get secrets, so they skip this job;
    # the push to main that merges one runs it.
    identity:
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # every commit's author and every file ever committed
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json)
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Identity guard (the repository and its history; the apps check their built sites)
              run: pnpm guard
              env:
                  PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }} # empty if the secret is missing, and then the guard fails

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json)
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --prod --audit-level high
            - run: pnpm lint
            - run: pnpm check
            - run: pnpm knip
            - run: pnpm test:unit
            # the example page in Chromium, desktop and phone (playwright.config.ts)
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:browser
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: browser-test-traces
                  path: test-results/
                  retention-days: 7
